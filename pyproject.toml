[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
version = "0.1"
description = "Measurement-control and analysis tools for flux-map and two-tone spectroscopy of superconducting circuits."
readme = "README.md"
requires-python = ">=3.10"  # experiment_data.py uses @dataclass(kw_only=True)
authors = [
    { name = "Alexander Wagner", email = "alexander.wagner@cea.fr" },
]
classifiers = [
    # No LICENSE file is checked in yet -- add one and restore a
    # "License :: OSI Approved :: ..." classifier once the license is decided.
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "qutip",
    "scikit-learn",
    "lmfit",
    # PyPI's "resonator" only ever published 1.1.0 -- there is no 0.x
    # release there at all, so "resonator<1.0" (a previous version of this
    # file) is literally unsatisfiable and breaks installation outright.
    # The only version this codebase has actually been run against is the
    # git commit below (reports its own __version__ as 0.8.0, pre-dating
    # the PyPI release), so pin to that exact commit rather than guess
    # whether 1.1.0's API still matches (analysis.py's
    # shunt.LinearShuntFitter, see.triptych,
    # background.MagnitudeSlopeOffsetPhaseDelay calls are untested against
    # it). Same commit as requirements-lock.txt.
    "resonator @ git+https://github.com/danielflanigan/resonator.git@97f4183ca956d40ca3be606dc4b7fc202360ac58",
    "PyQt6",
    "ipython",
    "tqdm",
    # Note: the `instruments` package (experiment_config.py, experiment.py,
    # flux_map_experiment.py, two_tone_experiment.py all import from it) is
    # this lab's own instrument-driver package
    # (https://github.com/err4re/instruments), not published on PyPI --
    # install it separately, e.g.:
    #   pip install -e git+https://github.com/err4re/instruments.git#egg=instruments
    # before this package will actually import. It can't be listed here
    # without a resolvable index/URL.
]

[project.urls]
Homepage = "https://github.com/err4re/experiments"

[tool.setuptools.packages.find]
where = ["."]
